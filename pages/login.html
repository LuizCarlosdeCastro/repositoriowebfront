<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="../assets/icons/healingrite.ico" type="image/x-icon">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <div class="card-form">
        <h1>Formulario de cadastro</h1>
        <form id="form-login">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Digite seu email">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" min="6" max="18" placeholder="Digite sua senha">

            <div class="botoes">
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </div>
            
        </form>
    </div>
    <script>
        //script para enviar para a pagina das tabelas pós 'login' falso 
        document.getElementById('form-login').addEventListener('submit', function(event) {
            event.preventDefault();

        
            window.location.href = '../pages/admin.html';
        });
    </script>
</body>
</html>
