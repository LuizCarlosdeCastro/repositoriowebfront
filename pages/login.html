<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="../assets/icons/healingrite.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

    <!-- card de login com bootstrap -->
    <div class="card shadow-sm border-0 w-100" style="max-width: 420px;">
        <div class="card-body p-4">
            
            <h1 class="h4 text-center fw-bold text-dark mb-4">Formulário de cadastro</h1>
            
            <form id="form-login">
                
                <!-- campos do login -->
                <div class="mb-3">
                    <label for="nome" class="form-label font-weight-bold">Nome</label>
                    <input type="text" class="form-control" id="nome" name="nome" required placeholder="Digite seu nome">
                </div>

              
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="Digite seu email">
                </div>

          
                <div class="mb-4">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password" minlength="6" maxlength="18" required placeholder="Digite sua senha">
                </div>

                <!-- botões -->
                <div class="row g-2">
                    <div class="col-8">
                        <button type="submit" class="btn btn-primary w-100 fw-semibold">Enviar</button>
                    </div>
                    <div class="col-4">
                        <button type="reset" class="btn btn-outline-secondary w-100">Limpar</button>
                    </div>
                </div>
                
            </form>
            
        </div>
    </div>

    <!-- script para enviar para a pagina das tabelas pós 'login' falso -->
    <script>
        document.getElementById('form-login').addEventListener('submit', function(event) {
            event.preventDefault();
            window.location.href = '../pages/admin.html';
        });
    </script>
    
    <!-- script do bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
